  <title>Lucarpro · Repuestos por categoría</title>
  <style>
:root {

.inline-link:hover, .bare:hover { text-decoration-color:currentColor; color:#083f58; }
.photo { display:block; width:100%; height:100%; min-width:0; min-height:0; mix-blend-mode:multiply; pointer-events:none; }

.select-wrap { position:relative; display:block; }

select, .text-input { width:100%; min-height:46px; border:1px solid #b9cbd3; border-radius:5px; background:#fff; padding:9px 35px 9px 13px; font-size:.99rem; font-weight:500; }

.heading-row { display:flex; align-items:baseline; justify-content:space-between; gap:18px; margin-bottom:18px; }
.catalog-block { padding-block:clamp(28px,3vw,44px) clamp(40px,5vw,72px); }

.product-card:hover { border-color:#7399aa; box-shadow:0 3px 10px #102b3710; }

.card-body { display:flex; flex:1; flex-direction:column; align-items:flex-start; gap:8px; padding:15px 16px 17px; }

.meta { color:var(--muted); font-size:.9rem; }

}

  .catalog-layout { grid-template-columns:minmax(0,1fr); gap:14px; margin-top:14px; padding-top:14px; }

  .family-mobile { display:flex; align-items:center; gap:12px; font-size:.94rem; font-weight:650; }
  .family-mobile .select-wrap { flex:1; }
  .catalog-results .product-grid { gap:12px; }
  .card-consult { min-height:44px; }
  .mode-categorias .catalog-block { padding-block:22px 34px; }
  .mode-categorias .heading-row h2 { font-size:1.65rem; }
  .newsletter-inner { grid-template-columns:1fr; gap:18px; }
  .product-detail { gap:24px; }
  .detail-photo { height:250px; padding:20px; }
  .order { flex-wrap:wrap; }
  .footer-in { gap:14px; padding-block:20px; }
}
@media (min-width:541px) and (max-width:800px) {
  .tiles { grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:auto auto; }
  .tile.big { grid-column:1/-1; grid-row:auto; min-height:166px; }
  .tile.big .photo { height:148px; }
  .tile:not(.big) { grid-template-columns:minmax(0,1fr) minmax(0,32%); padding:14px; min-height:112px; }
  .tile:not(.big) h2 { font-size:1.23rem; }
  .tile:not(.big) .photo { height:77px; }
}
@media (max-width:540px) {
  .heading-row { align-items:flex-start; gap:9px; }
  .heading-row h2 { font-size:1.58rem; }
  .heading-row .inline-link { font-size:.82rem; text-align:right; flex-shrink:0; padding-top:3px; }
  .product-grid { gap:9px; }
  .card-body { gap:5px; padding:10px; }
  .card-body h3 { font-size:1rem; }
  .card-body .meta { font-size:.83rem; }
  .card-price { font-size:1.13rem; }
  .card-image { height:123px; }
  .category-main h1, .category-catalogue h1 { font-size:2.08rem; }
  .category-main .intro { margin-top:6px; font-size:.97rem; }
  .tiles { grid-template-columns:1fr 1fr; grid-template-rows:auto auto; margin-top:14px; }
  .tile.big { grid-column:1/-1; grid-row:auto; grid-template-columns:1fr .9fr; min-height:158px; }
  .tile.big h2 { font-size:2.05rem; }
  .tile.big .photo { height:139px; }
  .tile:not(.big) { display:flex; flex-direction:column-reverse; align-items:stretch; gap:8px; padding:11px; }
  .tile:not(.big) .photo { height:68px; }
  .tile:not(.big) h2 { font-size:1.05rem; }
  .tile:not(.big) .sub, .tile:not(.big) .tile-action { display:none; }
  .mode-categorias .heading-row { margin-bottom:10px; }
  .catalog-results .product-grid, .mode-categorias .catalog-block .product-grid { gap:10px; }
  .catalog-card .card-image { height:116px; padding:10px 8%; }
  .catalog-card .card-body { padding:11px 10px; }
  .catalog-card h3 { font-size:1.02rem; }
  .catalog-actions .card-price { font-size:1.19rem; }
  .catalog-actions { padding-top:8px; }
  .card-fit { gap:0 5px; }
  .product-detail { grid-template-columns:1fr; gap:18px; }
  .detail-photo { height:225px; }
  .detail-price { margin-block:13px; }
  .order { flex-wrap:nowrap; }
  .crumbs { margin-bottom:15px; font-size:.84rem; }
  .panel-inner { padding:19px; }
  .footer-in { align-items:flex-start; flex-direction:column; }
  .newsletter-fields { flex-direction:column; }
  .foot-actions { gap:17px; }
}
@media (max-width:355px) {
  .wrap { width:calc(100% - 24px); }
  .card-image { height:105px; }
  .tile:not(.big) h2 { font-size:.93rem; }
  .order .btn { padding-inline:12px; }
}
@media (max-width:23rem) {
  .catalog-results .product-grid, .mode-categorias .catalog-block .product-grid { grid-template-columns:minmax(0,1fr); }
  .catalog-card .card-image { height:148px; }
}
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
}

    ? `<p class="card-fit"><span>Año por confirmar</span> <a class="card-consult" href="${whatsappHref(part)}" target="_blank" rel="noopener noreferrer" aria-label="Consultar por WhatsApp el año de aplicación de ${html(part.name)}">WhatsApp</a></p>`
    : '';
  return `<article class="product-card catalog-card"><div class="card-image">${photo(part.id)}</div>
    <div class="card-body"><h3><a class="card-link" href="${html(routeProduct(part))}">${part.name}</a></h3>
    <p class="meta${part.code ? ' mono' : ''}">${html(specification)}</p>${fit}<div class="catalog-actions">
    <div class="catalog-cost"><strong class="card-price">${cash(part.price)}</strong>${unit ? `<span class="selling-unit">/ ${html(unit.toLowerCase())}</span>` : ''}</div>${icon('arrow')}</div></div></article>`;
}
function grid(list) { return `<div class="product-grid">${list.map(card).join('')}</div>`; }
function selectedCategory(category) { return linkTo('catalogo', { categoria: category }); }
function counts(value) { return value === 1 ? '1 repuesto' : `${value} repuestos`; }
function notice(message) {
  document.querySelector('#noticia').textContent = message;
}
function readCart() {
  try {
    const value = JSON.parse(localStorage.getItem(storageKey) || '{}');
    return Object.fromEntries(Object.entries(value || {}).filter(([id, qty]) => byId.has(id) && Number.isInteger(qty) && qty > 0 && qty <= quantityLimit));
  } catch { return {}; }
}
let cart = readCart();
const totalCount = () => Object.values(cart).reduce((sum, value) => sum + value, 0);
const subtotal = () => Object.entries(cart).reduce((sum, [id, qty]) => sum + byId.get(id).price * qty, 0);
function storeCart() {
  try { localStorage.setItem(storageKey, JSON.stringify(cart)); } catch {}
  document.querySelectorAll('[data-count]').forEach(node => { node.textContent = totalCount(); });
  document.querySelectorAll('[data-action="cart"]').forEach(node => { node.setAttribute('aria-label', 'Carrito, ' + counts(totalCount())); });
}

function simpleSearch(id, placeholder, inHeader = false) {
  const inResults = inHeader && route.view === 'catalogo';
  const family = inResults ? familyValue(route.q.get('categoria')) : '';
  const value = inResults ? route.q.get('q') : '';
  const label = family ? 'Buscar en ' + family + ' por nombre o código' : 'Buscar repuestos por nombre o código';
  return `<form id="${id}" class="search-wrap" data-form="${inResults ? 'catalog' : 'search'}" role="search" aria-label="${label}">
    ${inHeader ? icon('search') : ''}<label class="sr-only" for="${id}-q">${label}</label>
    <input type="search" id="${id}-q" name="q" placeholder="${placeholder}" value="${html(value)}" maxlength="80">
    ${family ? `<input type="hidden" name="categoria" value="${family}">` : ''}
    <button class="${inHeader ? 'search-submit' : 'icon-btn'}" type="submit" aria-label="Buscar">${inHeader ? 'Buscar' : icon('search')}</button></form>`;
}
function masthead() {
  const menu = `<button class="icon-btn menu-toggle" type="button" data-action="menu" aria-label="Abrir menú">${icon('menu')}</button>`;
  const contact = `<button class="tool-btn header-contact" type="button" data-action="contact">${icon('chat')} Contacto</button>`;
  const bag = `<button class="tool-btn" type="button" data-action="cart" aria-label="Carrito, ${counts(totalCount())}">${icon('bag')}<span class="tool-label">Carrito</span><span class="bag-count" data-count>${totalCount()}</span></button>`;
  const collections = `<nav class="collection-nav" aria-label="Familias de repuestos"><div class="wrap">
    <a href="${linkTo('catalogo')}">${icon('collections')} Catálogo</a>${families.map(f => `<a href="${selectedCategory(f)}" ${route.view === 'producto' && byId.get(route.id)?.family === f ? 'aria-current="location"' : ''}>${f}</a>`).join('')}
    <button class="flexicon ship" type="button" data-action="shipping">${icon('truck')} Despacho a todo Chile</button></div></nav>`;
  return `<header class="store-head category-head"><div class="wrap brandrow">
    ${menu}${headBrand()}<div class="header-search">${simpleSearch('head-search','Nombre o código del repuesto',true)}</div>
    <div class="tools">${contact}${bag}</div></div>${route.view !== 'catalogo' ? collections : ''}</header>`;
}
function footer() {
  return `<div class="store-footer"><div class="wrap footer-in"><div>${headBrand()}<p>Repuestos automotrices · San Javier, Maule</p></div>
    <div class="foot-actions"><button class="flexicon" type="button" data-action="shipping">${icon('truck')} Despacho</button>
    <button class="flexicon" type="button" data-action="contact">${icon('chat')} Contacto</button></div></div></div>`;
}
function homeGrid(title) {
  return `<section class="wrap catalog-block" aria-label="Selección del catálogo"><div class="heading-row"><h2>${title}</h2>
    <a class="inline-link" href="${linkTo('catalogo')}">Ver catálogo ${icon('arrow')}</a></div>${grid(parts.slice(0,4))}</section>`;
}
function galleryHome() {
  const tiles = [
    { family: 'Aceites', sub: 'Lubricantes para el motor', part: 'quartz', style: 'big' },
    { family: 'Bujías', sub: 'Piezas de encendido', part: 'denso', style: 'plugs' },
    { family: 'Amortiguadores', sub: 'Suspensión delantera', part: 'kia', style: 'shocks' }
  ];
  return `<section class="wrap category-main"><h1>Repuestos para tu próxima mantención</h1><p class="intro">Explora el catálogo por tipo de repuesto.</p>
    <div class="tiles">${tiles.map(tile => `<a class="tile ${tile.style}" href="${selectedCategory(tile.family)}" aria-label="Ver categoría ${tile.family}">
      <div class="tile-inner"><h2>${tile.family}</h2><span class="sub">${tile.sub}</span><span class="tile-action">Ver categoría ${icon('arrow')}</span></div>${photo(tile.part)}</a>`).join('')}</div>
    </section>${homeGrid('Del catálogo')}
    <section class="newsletter" id="boletin" aria-labelledby="boletin-titulo"><div class="wrap newsletter-inner">
      <div class="newsletter-copy"><h2 id="boletin-titulo">Avísame cuando haya ofertas</h2>
        <p>Recibe por correo las promociones de aceites, bujías y otros repuestos de Lucarpro.</p></div>
      <form class="newsletter-form" data-form="newsletter" aria-labelledby="boletin-titulo">
        <label for="boletin-correo">Correo electrónico</label>
        <div class="newsletter-fields">
          <input class="text-input" id="boletin-correo" type="email" required autocomplete="off" placeholder="nombre@ejemplo.cl" aria-describedby="boletin-nota">
          <button class="btn" type="submit">Suscribirme</button>
        </div>
        <p class="newsletter-note" id="boletin-nota" role="status">Prueba el boletín con un correo de ejemplo.</p>
      </form></div></section>`;
}
function noMatches(reset) {
  return `<div class="empty"><h3>Sin coincidencias</h3><p>Prueba con otro nombre, código o categoría.</p>
    <a class="bare" href="${reset}">Ver todos los repuestos</a></div>`;
}
function crumbs(items) {
  return `<nav class="crumbs" aria-label="Ruta de navegación">${items.map(([name, href], index) => (index ? '<span aria-hidden="true">/</span>' : '') + (href ? `<a href="${href}">${html(name)}</a>` : `<span aria-current="page">${html(name)}</span>`)).join('')}</nav>`;
}
function categoryFilters(selected, matching) {
  const filters = ['', ...families].map(family => ({
    family,
    label:family || 'Todas las categorías',
    total:family ? matching.filter(part => part.family === family).length : matching.length,
    url:linkTo('catalogo',{ ...Object.fromEntries(route.q), categoria:family || null })
  }));
  return `<aside class="catalog-filters"><h2>Categorías</h2><nav class="family-options" aria-label="Filtrar por categoría">
    ${filters.map(item => `<a href="${html(item.url)}" ${selected === item.family ? 'aria-current="true"' : ''}>${item.family || 'Todas'}<span class="family-count" aria-hidden="true">${item.total}</span></a>`).join('')}</nav>
    <label class="family-mobile">Categoría<span class="select-wrap"><select data-family-filter>
    ${filters.map(item => `<option value="${html(item.url)}" ${selected === item.family ? 'selected' : ''}>${item.label}</option>`).join('')}</select></span></label></aside>`;
}
function catalogue() {
  const query = route.q.get('q') || '';
  const selected = familyValue(route.q.get('categoria'));
  const brand = route.q.get('marca') || '', model = route.q.get('modelo') || '', year = route.q.get('anio') || '';
  const isFit = Boolean(brand);
  const matching = parts.filter(p => matchText(p, query) && matchVehicle(p, brand, model, year));
  const found = selected ? matching.filter(p => p.family === selected) : matching;
  const label = isFit ? ['Repuestos para',brand,model,year].filter(Boolean).join(' ') : selected || 'Catálogo de repuestos';
  const clear = linkTo('catalogo');
  const desc = isFit ? (found.some(p => p.fit && !p.fit.start) ? 'La ficha indica el modelo. Confirma el año de aplicación con Lucarpro.' : 'Selección según los modelos y años publicados por Lucarpro.') : 'Selección de productos disponibles en este boceto.';
  const trail = [['Inicio',linkTo()],['Catálogo',selected ? clear : null]];
  if (selected) trail.push([selected,null]);
  return `<section class="wrap category-catalogue">${crumbs(trail)}
    <div class="catalog-heading"><h1>${html(label)}</h1><span class="catalog-count">${counts(found.length)}</span></div>
    <div class="catalog-context"><p>${query ? 'Resultados para «' + html(query) + '».' : isFit ? desc : 'Precios de muestra en pesos chilenos.'}</p>
    ${query || selected || isFit ? `<a class="bare" href="${clear}">Limpiar filtros</a>` : ''}</div>
    <div class="catalog-layout">${categoryFilters(selected,matching)}
    <section class="catalog-results" aria-label="Resultados del catálogo"><h2 class="sr-only">Repuestos</h2>
    ${found.length ? grid(found) : noMatches(clear)}</section></div></section>`;
}
function productPage(part) {
  let listCrumb = [part.family,selectedCategory(part.family)];
  if (route.q.get('desde') === 'catalogo') {
    const filters = new URLSearchParams(route.q);
    filters.delete('desde');
    listCrumb = [familyValue(filters.get('categoria')) || 'Catálogo', linkTo('catalogo',Object.fromEntries(filters))];
  }
  return `<section class="wrap page-block">${crumbs([['Inicio',linkTo()],listCrumb,[part.name,null]])}
    <div class="product-detail"><figure class="detail-photo">${photo(part.id,part.name)}</figure>
    <div class="detail-info"><span class="detail-kind">${part.family}</span><h1>${part.name}</h1><p class="detail-note${part.code ? ' mono' : ''}">${part.note}</p>
    <p class="detail-price">${cash(part.price)}</p>
    <form class="order" data-form="add"><div class="field"><span>Cantidad</span><div class="qty-control">
    <button type="button" data-step="-1" aria-label="Disminuir cantidad" disabled>−</button><output id="units" aria-label="Cantidad">1</output>
    <button type="button" data-step="1" aria-label="Aumentar cantidad">+</button></div></div>
    <button class="btn" type="submit">${icon('bag')} Agregar al carrito</button></form>
    <button class="detail-ship" type="button" data-action="shipping">${icon('truck')} Despacho a todo Chile</button>
    <button class="bare detail-help" type="button" data-action="contact">Consultar compatibilidad</button></div></div>
    <section class="specs"><h2>Ficha técnica</h2><dl>${part.detail.map(([label,value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>
    <p>${part.fitNote}</p></section></section>`;
}

let panelView = '';
let panelOpener = null;
let firstRender = true;

function openPanel(view, title, contents, drawer = false, keepFocus = false) {
  const alreadyOpen = panel.open;
  if (!alreadyOpen) panelOpener = document.activeElement;
  const oldFocus = keepFocus && panel.contains(document.activeElement) ? document.activeElement.dataset.focus : '';
  panelView = view;
  panel.className = drawer ? 'drawer' : '';
  panel.innerHTML = `<div class="panel-inner"><div class="panel-head"><h2 id="panel-title">${title}</h2>
    <button type="button" class="icon-btn" data-action="close" aria-label="Cerrar">${icon('close')}</button></div>${contents}</div>`;
  if (!alreadyOpen) panel.showModal();
  const search = panel.querySelector('input[type="search"]');
  const prior = oldFocus && [...panel.querySelectorAll('[data-focus]')].find(el => el.dataset.focus === oldFocus && !el.disabled);
  (prior || search || panel.querySelector('[data-action="close"]')).focus({preventScroll: true});
}
function closePanel() {
  if (panel.open) panel.close();
}
panel.addEventListener('close', () => {
  panelView = '';
  if (panelOpener?.isConnected) panelOpener.focus({preventScroll:true});
  panelOpener = null;
});
panel.addEventListener('click', event => {
  if (event.target !== panel) return;
  const box = panel.getBoundingClientRect();
  if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) closePanel();
});
function actionsMenu(familiesOnly) {
  const collectionLinks = families.map(f => `<a href="${selectedCategory(f)}">${f}</a>`).join('');
  const first = `<a href="${linkTo('catalogo')}">Todos los repuestos</a>`;
  const extra = '<button type="button" data-action="search">Buscar un repuesto</button><button type="button" data-action="shipping">Información de despacho</button><button type="button" data-action="contact">Contacto</button>';
  openPanel('menu',familiesOnly ? 'Categorías' : 'Menú de la tienda',`<nav class="panel-links">${first}${collectionLinks}${familiesOnly ? '' : extra}</nav>`);
}
function whatsappHref(part) {
  let topic = 'Hola, quisiera consultar por un repuesto.';
  if (part) {
    const name = part.name + (part.code ? ' (' + part.code + ')' : '');
    topic = part.fit && !part.fit.start
      ? 'Hola, estoy viendo ' + name + '. ¿Para qué años de fabricación sirve este repuesto?'
      : 'Hola, quiero confirmar la compatibilidad de ' + name + ' con mi vehículo.';
  }
  return 'https://wa.me/56987651008?text=' + encodeURIComponent(topic);
}
function contactPanel() {
  const part = route.view === 'producto' ? byId.get(route.id) : null;
  openPanel('contact','Contacto con Lucarpro',`<div class="panel-stack">
    <p>${part ? 'Ten a mano la marca, el modelo, el año y la versión del motor para consultar por este repuesto.' : 'El equipo de San Javier atiende consultas sobre repuestos y compatibilidad.'}</p>
    <div class="flexicon">${icon('chat')} +56 9 8765 1008</div><div class="flexicon">${icon('mail')} Lucarpro001@gmail.com</div>
    <p>Lunes a viernes, de 09:00 a 18:00.</p><a class="btn outline" href="${whatsappHref(part)}" target="_blank" rel="noopener noreferrer">Abrir WhatsApp</a></div>`);
}
function shippingPanel() {
  openPanel('shipping','Despacho a todo Chile',`<div class="panel-stack"><p>Lucarpro anuncia despacho gratis en compras sobre $30.000. Algunas piezas pesadas o voluminosas pueden tener un costo adicional.</p>
    <p>El costo de envío se calcula al finalizar la compra en la tienda. Una vez despachado el pedido, Lucarpro envía el número de seguimiento por correo.</p>
    <a class="bare" href="https://lucarpro.cl/pages/politica-de-envio" target="_blank" rel="noopener noreferrer">Leer la política de envíos de Lucarpro</a></div>`);
}
function searchPanel() {
  openPanel('search','Buscar en el catálogo',simpleSearch('panel-search','Nombre o código, por ejemplo BKR6EIX-11') +
    '<p class="panel-note" style="margin-top:12px">Puedes buscar por pieza, marca o código de fabricante.</p>');
}
function cartPanel(keepFocus = false) {
  if (!totalCount()) {
    openPanel('cart','Carrito de prueba',`<div class="panel-stack"><p>Tu carrito está vacío.</p>
      <a class="btn" href="${linkTo('catalogo')}">Explorar repuestos</a></div>`,true);
    return;
  }
  const rows = Object.entries(cart).map(([id, qty]) => {
    const part = byId.get(id);
    return `<div class="cart-line"><div class="cart-image">${photo(id)}</div><div><h3>${part.name}</h3><span class="meta">${cash(part.price)} c/u</span>
      <div class="cart-controls"><div class="qty-control">
      <button data-cart-step="-1" data-id="${id}" data-focus="minus-${id}" aria-label="Quitar una unidad de ${part.name}" ${qty <= 1 ? 'disabled' : ''}>−</button>
      <output aria-label="Cantidad">${qty}</output>
      <button data-cart-step="1" data-id="${id}" data-focus="plus-${id}" aria-label="Agregar una unidad de ${part.name}" ${qty >= quantityLimit ? 'disabled' : ''}>+</button></div>
      <button class="remove" data-remove="${id}" aria-label="Eliminar ${part.name}">Eliminar</button></div></div><strong>${cash(part.price*qty)}</strong></div>`;
  }).join('');
  openPanel('cart','Carrito de prueba',`<div class="cart-list">${rows}</div><div class="tally"><span>Subtotal</span><strong>${cash(subtotal())}</strong></div>
    <p class="panel-note">Valores en pesos chilenos. Esta compra se simula en tu navegador.</p><div class="dialog-actions">
    <button class="btn" type="button" data-action="payment">Probar el pago</button><button class="btn outline" type="button" data-action="close">Seguir explorando</button></div>`,true,keepFocus);
}
function paymentPanel() {
  if (!totalCount()) { cartPanel(); return; }
  openPanel('payment','Simular pago',`<form data-form="pay" class="panel-stack"><p>Elige el medio de pago que quieres mostrar en la simulación.</p>
    <div class="tally"><span>Subtotal de productos</span><strong>${cash(subtotal())}</strong></div>
    <fieldset class="pay-options"><legend>Medio de pago de muestra</legend>
    <label><input type="radio" name="medio" value="Webpay" checked> Webpay</label>
    <label><input type="radio" name="medio" value="Mercado Pago"> Mercado Pago</label></fieldset>
    <p class="panel-note">Esta prueba termina aquí, sin cobros ni envío de datos.</p>
    <button class="btn" type="submit">Completar simulación</button><button class="bare" type="button" data-action="cart">Volver al carrito</button></form>`,true);
}
document.addEventListener('change', event => {
  if (event.target.matches('[data-family-filter]')) redirect(event.target.value);
});
document.addEventListener('click', event => {
  const skip = event.target.closest('.skip');
  if (skip) { event.preventDefault(); main.focus(); main.scrollIntoView(); return; }
  const internal = event.target.closest('a[href^="#/"]');
  if (internal) {
    if (panel.open) closePanel();
    if (internal.hash === location.hash) { event.preventDefault(); updateView(); }
    return;
  }
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  const data = button.dataset;
  if (data.step) {
    const output = document.querySelector('#units');
    const next = Math.max(1,Math.min(quantityLimit,Number(output.value) + Number(data.step)));
    output.value = String(next);
    document.querySelector('[data-step="-1"]').disabled = next === 1;
    document.querySelector('[data-step="1"]').disabled = next === quantityLimit;
    return;
  }
  if (data.cartStep || data.remove) {
    const id = data.id || data.remove;
    if (!cart[id]) return;
    if (data.remove) delete cart[id];
    else cart[id] = Math.max(1,Math.min(quantityLimit,cart[id] + Number(data.cartStep)));
    storeCart();
    cartPanel(true);
    notice('Carrito actualizado. ' + counts(totalCount()) + '.');
    return;
  }
  switch (data.action) {
    case 'menu': return actionsMenu(false);
    case 'families': return actionsMenu(true);
    case 'shipping': return shippingPanel();
    case 'contact': return contactPanel();
    case 'cart': return cartPanel();
    case 'payment': return paymentPanel();
    case 'close': return closePanel();
    case 'search': return searchPanel();
  }
});
document.addEventListener('submit', event => {
  const form = event.target;
  if (!form.dataset.form) return;
  event.preventDefault();
  const data = new FormData(form);
  const q = String(data.get('q') || '').trim();
  const category = familyValue(data.get('categoria'));
  switch (form.dataset.form) {
    case 'newsletter':
      form.reset();
      form.querySelector('[role="status"]').textContent = 'Suscripción de prueba confirmada.';
      break;
    case 'catalog':
      redirect(linkTo('catalogo',{marca:route.q.get('marca'),modelo:route.q.get('modelo'),anio:route.q.get('anio'),q:q || null,categoria:category || null}));
      break;
    case 'search':
      closePanel();
      redirect(linkTo('catalogo',{q:q || null}));
      break;
    case 'add': {
      const id = route.id;
      if (!byId.has(id)) return;
      const qty = Number(document.querySelector('#units').value) || 1;
      cart[id] = Math.min(quantityLimit,(cart[id] || 0) + qty);
      storeCart();
      cartPanel();
      notice(byId.get(id).name + ' en el carrito.');
      break;
    }
    case 'pay': {
      const method = data.get('medio') === 'Mercado Pago' ? 'Mercado Pago' : 'Webpay';
      const amount = cash(subtotal());
      cart = {};
      storeCart();
      openPanel('done','Simulación completada',`<div class="panel-stack"><p>Recorrido de prueba con ${method}. El subtotal simulado fue de <strong>${amount}</strong>.</p>
        <p class="panel-note">Puedes seguir explorando el catálogo.</p><button class="btn" type="button" data-action="close">Volver a la tienda</button></div>`,true);
      break;
    }
  }
});
function updateView() {
  closePanel();
  route = getRoute();
  const part = route.view === 'producto' && byId.get(route.id);
  document.querySelector('#masthead').innerHTML = masthead();
  document.querySelector('#pie').innerHTML = footer();
  if (part) main.innerHTML = productPage(part);
  else if (route.view === 'catalogo') main.innerHTML = catalogue();
  else main.innerHTML = galleryHome();
  document.title = (part ? part.name : route.view === 'catalogo' ? 'Catálogo de repuestos' : 'Repuestos por categoría') + ' · Lucarpro';
  if (location.hash === '#boletin') {
    document.getElementById('boletin').scrollIntoView();
  } else if (!firstRender) {
    main.focus({preventScroll:true});
    window.scrollTo(0,0);
  }
  firstRender = false;
}
window.addEventListener('hashchange',updateView);
window.addEventListener('storage',event => {
  if (event.key !== storageKey) return;
  cart = readCart();
  document.querySelectorAll('[data-count]').forEach(el => { el.textContent = totalCount(); });
  document.querySelectorAll('[data-action="cart"]').forEach(el => { el.setAttribute('aria-label','Carrito, ' + counts(totalCount())); });
  if (panel.open && (panelView === 'cart' || panelView === 'payment')) cartPanel();
});
updateView();

  </script>
